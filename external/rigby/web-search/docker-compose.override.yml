services:
  web-search-mcp:
    ports: !override
    - 127.0.0.1:8006:8000
    volumes:
    - /etc/infra-pki/certs:/etc/ssl/certs:ro
    - /etc/infra-pki/certs/ca-certificates.crt:/usr/local/lib/python3.12/site-packages/certifi/cacert.pem:ro
    - /etc/infra-pki/certs/ca-certificates.crt:/usr/local/lib/python3.12/site-packages/pip/_vendor/certifi/cacert.pem:ro
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
      UV_NATIVE_TLS: 'true'
  web-search-mcp-canary:
    ports: !override
    - 127.0.0.1:18002:8000
    volumes:
    - /etc/infra-pki/certs:/etc/ssl/certs:ro
    - /etc/infra-pki/certs/ca-certificates.crt:/usr/local/lib/python3.12/site-packages/certifi/cacert.pem:ro
    - /etc/infra-pki/certs/ca-certificates.crt:/usr/local/lib/python3.12/site-packages/pip/_vendor/certifi/cacert.pem:ro
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
      UV_NATIVE_TLS: 'true'
  mcp-auth:
    image: nginx@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    container_name: web-search-mcp-auth
    network_mode: host
    restart: unless-stopped
    volumes:
    - /etc/web-search-mcp/nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/web-search-mcp/api-auth.conf:/etc/nginx/api-auth.conf:ro
    - /etc/infra-pki/certs:/etc/ssl/certs:ro
    depends_on:
      web-search-mcp:
        condition: service_healthy
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
      UV_NATIVE_TLS: 'true'
  valkey:
    image: valkey/valkey-bundle:9.0.5
    command:
    - --save
    - ''
    - --appendonly
    - 'no'
    - --maxmemory
    - 256mb
    - --maxmemory-policy
    - allkeys-lru
    volumes:
    - /etc/infra-pki/certs:/etc/ssl/certs:ro
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
      UV_NATIVE_TLS: 'true'
  crawl4ai:
    volumes:
    - /etc/infra-pki/certs:/etc/ssl/certs:ro
    - /etc/infra-pki/certs/ca-certificates.crt:/usr/local/lib/python3.12/site-packages/certifi/cacert.pem:ro
    - /etc/infra-pki/certs/ca-certificates.crt:/usr/local/lib/python3.12/site-packages/pip/_vendor/certifi/cacert.pem:ro
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
      UV_NATIVE_TLS: 'true'
      NODE_OPTIONS: --use-openssl-ca
  searxng:
    image: docker.io/searxng/searxng:2026.8.5-1689cb1b5
    volumes:
    - /etc/infra-pki/certs:/etc/ssl/certs:ro
    - /etc/infra-pki/certs/ca-certificates.crt:/usr/local/searxng/.venv/lib/python3.14/site-packages/certifi/cacert.pem:ro
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
      UV_NATIVE_TLS: 'true'
  lfm:
    image: ghcr.io/ggml-org/llama.cpp:server-b10326@sha256:bedbb0f38ff2c84893d2df350473fd438875d9ec23d23ce98e96df240e77d6ba
    volumes:
    - /etc/infra-pki/certs:/etc/ssl/certs:ro
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
      UV_NATIVE_TLS: 'true'

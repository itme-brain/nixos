---
- name: Recover Rigby AI services
  hosts: all
  become: true
  vars_files:
    - vars/main.yml
  pre_tasks:
    - name: Require Ubuntu 26.04 on amd64
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '26.04'
          - ansible_facts.architecture == 'x86_64'
        fail_msg: Install Ubuntu 26.04 LTS before running recovery.

    - name: Read the existing inference API secret on the controller
      ansible.builtin.command:
        argv: [sudo, -n, sops, decrypt, --output-type, json, '{{ rigby_llama_sops }}']
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: rigby_llama_decrypted
      changed_when: false
      check_mode: false
      no_log: true

    - name: Read the existing Authentik OIDC secret on the controller
      ansible.builtin.command:
        argv: [sudo, -n, sops, decrypt, --output-type, json, '{{ rigby_authentik_sops }}']
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: rigby_auth_decrypted
      changed_when: false
      check_mode: false
      no_log: true

    - name: Keep shared credentials in memory
      ansible.builtin.set_fact:
        rigby_llama_secrets: "{{ rigby_llama_decrypted.stdout | from_json }}"
        rigby_auth_secrets: "{{ rigby_auth_decrypted.stdout | from_json }}"
        cacheable: false
      no_log: true

  tasks:
    - name: Configure Ubuntu, AMD, Docker and host users
      ansible.builtin.include_tasks: tasks/host.yml

    - name: Restore application repositories and configuration
      ansible.builtin.include_tasks: tasks/applications.yml

    - name: Build Radiance and restore the Qwen model
      ansible.builtin.include_tasks: tasks/radiance.yml

    # The address may change here; do this after recovering all services.
    - name: Install static network configuration
      ansible.builtin.template:
        src: ../templates/99-rigby-static.yaml.j2
        dest: /etc/netplan/99-rigby-static.yaml
        owner: root
        group: root
        mode: "0600"
      register: rigby_netplan
      when: rigby_static_network_enabled | bool

    - name: Apply changed static networking
      ansible.builtin.command: netplan apply
      when: rigby_static_network_enabled | bool and rigby_netplan.changed
      changed_when: true

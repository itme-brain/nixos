worker_processes auto;
events { worker_connections 1024; }
http {
    map_hash_bucket_size 128;
    include /etc/nginx/api-auth.conf;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server {
        listen 8002;
        client_max_body_size 10m;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID" always;
        add_header Access-Control-Expose-Headers "Mcp-Session-Id, MCP-Protocol-Version" always;
        if ($request_method = OPTIONS) { return 204; }
        if ($mcp_authorized = 0) { return 401; }
        location / {
            proxy_pass http://127.0.0.1:8006;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}

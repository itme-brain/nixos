worker_processes auto;
events { worker_connections 1024; }
http {
    map_hash_bucket_size 128;
    include /etc/nginx/api-auth.conf;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server {
        listen 9331;
        client_max_body_size 64m;
        add_header X-Accel-Buffering no always;
        location ^~ /systemone/ {
            allow 192.168.0.154;
            deny all;
            proxy_pass http://127.0.0.1:3090/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /systemone;
            proxy_read_timeout 180s;
        }
        location = /health {
            proxy_pass http://127.0.0.1:3080;
            add_header Cache-Control "no-store" always;
        }
        location = /v1/systemone {
            if ($mcp_authorized = 0) { return 401; }
            proxy_pass http://127.0.0.1:9333;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location ~ ^/(v1(?:/|$)|models(?:/|$)|(?:completion|completions|tokenize|detokenize|apply-template|health|ping|metrics|props|slots|diagnostics|stats)(?:/|$)) {
            if ($mcp_authorized = 0) { return 401; }
            proxy_pass http://127.0.0.1:9332;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location / {
            allow 192.168.0.154;
            deny all;
            proxy_pass http://127.0.0.1:3080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
